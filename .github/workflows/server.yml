name: Online server (Docker)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t mini-racing-server .

      - name: Start server container
        run: |
          docker run -d --name mrs -p 9080:9080 mini-racing-server
          sleep 5
          docker logs mrs

      - name: Download Godot (test client)
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --editor --path . --quit

      - name: Two clients create and join a room on the container
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --script res://tests/net_client_check.gd -- --url=ws://127.0.0.1:9080 2>&1 | tee check.log
          grep -q "REMOTE SERVER OK" check.log

      - name: Server logs
        if: always()
        run: docker logs mrs || true
