name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_STATUS: "stable"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot editor
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$DEST"
          curl -L --fail --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          # Only the Android templates are needed; skip the other platforms to save disk.
          unzip -q /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "$DEST/"
          rm -f /tmp/templates.tpz
          ls -la "$DEST"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_SDK_PATH=$SDK" >> "$GITHUB_ENV"

      - name: Create debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          # Godot 4.3 reads editor_settings-4.3.tres (older versions used editor_settings-4.tres).
          for f in "editor_settings-4.3.tres" "editor_settings-4.tres"; do
          cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_PATH"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Set online server URL (optional)
        if: ${{ vars.MINI_RACING_SERVER_URL != '' }}
        run: |
          echo "Using server URL from repository variable MINI_RACING_SERVER_URL"
          sed -i "s|^const DEFAULT_SERVER_URL := .*|const DEFAULT_SERVER_URL := \"${{ vars.MINI_RACING_SERVER_URL }}\"|" scripts/net_config.gd
          grep DEFAULT_SERVER_URL scripts/net_config.gd

      - name: Import project
        run: |
          godot --headless --editor --path . --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then echo "GDScript errors found"; exit 1; fi

      - name: Run headless tests
        run: |
          set -o pipefail
          timeout 300 godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee tests.log
          if grep -E "SCRIPT ERROR|Parse Error" tests.log; then echo "GDScript errors during tests"; exit 1; fi
          grep -q "ALL TESTS PASSED" tests.log

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/MiniRacing-debug.apk 2>&1 | tee export.log
          test -f build/MiniRacing-debug.apk
          ls -la build
          "$ANDROID_SDK_PATH/build-tools/34.0.0/apksigner" verify --verbose build/MiniRacing-debug.apk

      - name: Check APK manifest (landscape + internet)
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_SDK_PATH/build-tools/34.0.0/aapt2"
          "$AAPT2" dump badging build/MiniRacing-debug.apk | head -n 20
          "$AAPT2" dump xmltree --file AndroidManifest.xml build/MiniRacing-debug.apk > manifest.txt
          grep -E "screenOrientation|permission" manifest.txt || true
          grep -q "android.permission.INTERNET" manifest.txt
          # 0 = landscape, 6 = sensorLandscape
          grep -E "screenOrientation\([^)]*\)=(0|6)$" manifest.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniRacing-debug-apk
          path: build/MiniRacing-debug.apk
          if-no-files-found: error
